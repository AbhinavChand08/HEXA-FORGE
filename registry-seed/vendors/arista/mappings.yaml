# ---- TACACS
- {template: "tacacs-server host <IPV4> key <NUM> <SECRET>", emits: [{key: TACACS.SERVERS, value: "v1"}]}
- {template: "tacacs-server host <IPV4> vrf <WORD> key <NUM> <SECRET>", emits: [{key: TACACS.SERVERS, value: "v1"}]}
- {template: "tacacs-server host <IPV4> vrf <WORD> key <NUM> <SECRET> port <NUM>", emits: [{key: TACACS.SERVERS, value: "v1"}]}
- {template: "tacacs-server host <IPV4> vrf <WORD> key <NUM> <SECRET> timeout <NUM>", emits: [{key: TACACS.SERVERS, value: "v1"}]}
- {template: "tacacs-server timeout <NUM>", emits: [{key: TACACS.TIMEOUT_SEC, value: "v1"}]}

# ---- usernames
- template: "username <WORD:user> privilege <NUM:priv> role network-admin"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}]
- template: "username <WORD:user> privilege <NUM:priv> role network-admin nopassword"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'plaintext'"}]
- template: "username <WORD:user> privilege <NUM:priv> role network-admin secret <NUM:type> <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits:
    - {key: USER.PRIVILEGE, value: "priv"}
    - {key: USER.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt'})"}
- template: "username <WORD:user> privilege <NUM:priv> role network-operator secret <NUM:type> <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits:
    - {key: USER.PRIVILEGE, value: "priv"}
    - {key: USER.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt'})"}
- template: "username <WORD:user> privilege <NUM:priv> secret <NUM:type> <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits:
    - {key: USER.PRIVILEGE, value: "priv"}
    - {key: USER.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt'})"}

# ---- VLANs / VRFs
- {template: "vlan <NUM>", ignore: true}
- {template: "vlan <NUM> > name <WORD>", ignore: true}
- {template: "vlan <NUM> > state <ENUM>", ignore: true}
- {template: "vrf instance <ENUM>", ignore: true}
- {template: "vrf instance <ENUM> > description <TEXT>", ignore: true}
