# Reviewer-approved Arista EOS mappings.

# ---- AAA accounting / authentication
- {template: "aaa accounting commands all default start-stop group <WORD>", emits: [{key: AAA.ACCOUNTING_COMMANDS, value: "True"}]}
- {template: "aaa accounting commands all default stop-only group <WORD>", emits: [{key: AAA.ACCOUNTING_COMMANDS, value: "True"}]}
- {template: "aaa accounting exec default start-stop group <WORD>", emits: [{key: AAA.ACCOUNTING_EXEC, value: "True"}]}
- {template: "aaa accounting system default start-stop group <WORD>", ignore: true}
- {template: "aaa authentication enable default <ENUM>", ignore: true}
- {template: "aaa authentication enable default enable <ENUM>", ignore: true}
- {template: "aaa authentication enable default group <WORD> <ENUM>", ignore: true}
- template: "aaa authentication login default <ENUM:method>"
  emits: [{key: AAA.LOGIN_METHODS, value: "[method]"}]
- template: "aaa authentication login default group <WORD:srv> <ENUM:fallback>"
  emits: [{key: AAA.LOGIN_METHODS, value: "[srv, fallback]"}]
- template: "aaa authentication login default group <WORD:srv> local <ENUM>"
  emits: [{key: AAA.LOGIN_METHODS, value: "[srv, 'local']"}]
- {template: "aaa authentication login default local <ENUM>", emits: [{key: AAA.LOGIN_METHODS, value: "['local']"}]}
- {template: "aaa authentication policy local allow-nopassword-remote-login", ignore: true}
- {template: "aaa authorization commands all default <ENUM>", ignore: true}
- {template: "aaa authorization commands all default group <ENUM> <ENUM>", ignore: true}
- {template: "aaa authorization config-commands", ignore: true}
- {template: "aaa authorization exec default <ENUM>", ignore: true}
- {template: "aaa authorization exec default group <WORD> <ENUM>", ignore: true}
- {template: "aaa authorization exec default group <WORD> local <ENUM>", ignore: true}
- {template: "aaa group server <WORD> <WORD>", ignore: true}
- {template: "aaa group server <WORD> <WORD> > server <IPV4> vrf <WORD>", ignore: true}
- {template: "aaa root", ignore: true}
- {template: "aaa root secret <NUM> <SECRET>", ignore: true}

# ---- banners
- {template: "banner login", emits: [{key: BANNER.LOGIN, value: "blob"}]}
- {template: "banner motd", emits: [{key: BANNER.MOTD, value: "blob"}]}

# ---- DNS
- {template: "dns domain <WORD>", ignore: true}

# ---- enable
- template: "enable secret <NUM:type> <SECRET>"
  emits: [{key: ENABLE.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt'})"}]
- {template: "enable password <NUM> <SECRET>", emits: [{key: ENABLE.HASH_ALGORITHM, value: "enum_map(v1, {5: 'md5', 7: 'type7'})"}]}
- {template: "enable password", emits: [{key: ENABLE.HASH_ALGORITHM, value: "'plaintext'"}]}

# ---- hostname
- {template: "hostname <WORD>", ignore: true}

