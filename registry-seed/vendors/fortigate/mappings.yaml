# ---- system global (security-relevant settings)
- {template: "config system global", ignore: true}
- {template: "config system global > admin-https-redirect disable", emits: [{key: HTTP_SERVER.ENABLED, value: "True"}]}
- {template: "config system global > admin-https-ssl-versions tlsv1-3", ignore: true}
- {template: "config system global > admin-lockout-duration <NUM>", emits: [{key: LOGIN.BLOCK_FOR_SEC, value: "v1"}]}
- {template: "config system global > admin-lockout-threshold <NUM>", ignore: true}
- {template: "config system global > admin-port <NUM>", ignore: true}
- {template: "config system global > admin-server-cert <QSTR>", ignore: true}
- {template: "config system global > admin-sport <NUM>", ignore: true}
- template: "config system global > admintimeout <NUM:min>"
  emits: [{key: ADMIN.SESSION_TIMEOUT_SEC, value: "to_seconds(min, 'min')"}]
- {template: "config system global > gui-cdn-usage enable", ignore: true}
- {template: "config system global > gui-display-hostname disable", ignore: true}
- {template: "config system global > hostname <QSTR>", ignore: true}
- {template: "config system global > log-single-cpu-high enable", ignore: true}
- {template: "config system global > post-login-banner enable", emits: [{key: BANNER.MOTD, value: "True"}]}
- {template: "config system global > pre-login-banner enable", emits: [{key: BANNER.LOGIN, value: "True"}]}
- {template: "config system global > ssl-static-key-ciphers disable", ignore: true}
- {template: "config system global > strong-crypto enable", emits: [{key: CRYPTO.RSA_MODULUS_BITS, value: "2048"}]}
- {template: "config system global > timezone <NUM>", ignore: true}

