# ---- interfaces
- {template: "interface <IFNAME:ifname>", scope: {type: INTERFACE, id: "{ifname}"}}
- template: "interface <IFNAME:ifname> > description <TEXT:desc>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.DESCRIPTION, value: "desc"}]
- template: "interface <IFNAME:ifname> > shutdown"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.SHUTDOWN, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip proxy-arp"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.PROXY_ARP, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip access-group <WORD:acl> in"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.ACL_IN, value: "acl"}]
- template: "interface <IFNAME:ifname> > ip access-group <WORD:acl> out"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.ACL_OUT, value: "acl"}]
- template: "interface <IFNAME:ifname> > ip verify unicast source reachable-via <ENUM>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.URPF, value: "not negated"}]
