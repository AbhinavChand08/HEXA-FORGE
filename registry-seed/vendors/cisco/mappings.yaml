# Reviewer-approved Cisco IOS mappings used to bootstrap the registry (and the suggester's kNN).
# template: full template path; <TYPE:name> names a slot (unnamed slots are v1..vn,
#           numbered across the whole path, parents first).
# scope:    {type, id}; id is a '{slot}' format string. A mapping with a scope and
#           no emits only declares scope instances (so vendor defaults can fill them).
# emits:    key + value expression (+ optional 'when' guard). A negated command
#           emits only if the expression reads 'negated'.
# The folder name is the vendor_family of every entry.

- {template: "version <NUM>", emits: [{key: SYSTEM.OS_VERSION, value: "tokens[1]"}]}
- {template: "version <WORD>", emits: [{key: SYSTEM.OS_VERSION, value: "tokens[1]"}]}

# ---- terminal lines: scope instances, then their settings
- {template: "line con <NUM:lno>", scope: {type: LINE, id: "con {lno}"}}
- {template: "line aux <NUM:lno>", scope: {type: LINE, id: "aux {lno}"}}
- {template: "line vty <NUM:first> <NUM:last>", scope: {type: LINE, id: "vty {first} {last}"}}

- template: "line con <NUM:lno> > exec-timeout <NUM:min> <NUM:sec>"
  scope: {type: LINE, id: "con {lno}"}
  emits: [{key: LINE.EXEC_TIMEOUT_SEC, value: "min * 60 + sec"}]
- template: "line aux <NUM:lno> > exec-timeout <NUM:min> <NUM:sec>"
  scope: {type: LINE, id: "aux {lno}"}
  emits: [{key: LINE.EXEC_TIMEOUT_SEC, value: "min * 60 + sec"}]
- template: "line vty <NUM:first> <NUM:last> > exec-timeout <NUM:min> <NUM:sec>"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.EXEC_TIMEOUT_SEC, value: "min * 60 + sec"}]
- template: "line vty <NUM:first> <NUM:last> > transport input <ENUM:proto>"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.TRANSPORT_INPUT, value: "proto"}]
- template: "line vty <NUM:first> <NUM:last> > transport input ssh telnet"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.TRANSPORT_INPUT, value: "tokens[2:]"}]
- template: "line aux <NUM:lno> > transport input <ENUM:proto>"
  scope: {type: LINE, id: "aux {lno}"}
  emits: [{key: LINE.TRANSPORT_INPUT, value: "proto"}]
- template: "line vty <NUM:first> <NUM:last> > access-class <NUM:acl> in"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.ACCESS_CLASS, value: "str(acl)"}]
- template: "line vty <NUM:first> <NUM:last> > access-class <WORD:acl> in"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.ACCESS_CLASS, value: "acl"}]
- template: "line aux <NUM:lno> > exec"
  scope: {type: LINE, id: "aux {lno}"}
  emits: [{key: LINE.EXEC_ENABLED, value: "not negated"}]
- template: "line aux <NUM:lno> > transport output <ENUM:proto>"
  scope: {type: LINE, id: "aux {lno}"}
  emits: [{key: LINE.TRANSPORT_OUTPUT, value: "[proto]"}]
- template: "line con <NUM:lno> > logging synchronous"
  scope: {type: LINE, id: "con {lno}"}
  emits: [{key: LINE.LOGGING_SYNC, value: "True"}]
- template: "line con <NUM:lno> > login <ENUM:method>"
  scope: {type: LINE, id: "con {lno}"}
  emits: [{key: LINE.LOGIN_METHOD, value: "method"}]
- template: "line con <NUM:lno> > login authentication default"
  scope: {type: LINE, id: "con {lno}"}
  emits: [{key: LINE.LOGIN_AUTH, value: "True"}]
- template: "line vty <NUM:first> <NUM:last> > logging synchronous"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.LOGGING_SYNC, value: "True"}]
- template: "line vty <NUM:first> <NUM:last> > login <ENUM:method>"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.LOGIN_METHOD, value: "method"}]
- template: "line vty <NUM:first> <NUM:last> > login authentication default"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.LOGIN_AUTH, value: "True"}]
- template: "line vty <NUM:first> <NUM:last> > transport output <ENUM:proto>"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.TRANSPORT_OUTPUT, value: "[proto]"}]
- template: "line vty <NUM:first> <NUM:last> > transport output ssh"
  scope: {type: LINE, id: "vty {first} {last}"}
  emits: [{key: LINE.TRANSPORT_OUTPUT, value: "['ssh']"}]

