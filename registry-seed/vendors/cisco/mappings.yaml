    - {key: SNMP.V3_PRIV_PROTOCOL, value: "'des'"}
  template: "snmp-server user snmpadmin <WORD> v3 auth md5 <SECRET> priv des <SECRET>"
- {template: "snmp-server user snmpadmin <WORD> v3 auth sha <SECRET>", emits: [{key: SNMP.V3_AUTH_PROTOCOL, value: "'sha'"}]}
- emits:
    - {key: SNMP.V3_AUTH_PROTOCOL, value: "'sha'"}
    - {key: SNMP.V3_PRIV_PROTOCOL, value: "'aes-' + str(v3)"}
  template: "snmp-server user snmpadmin <WORD> v3 auth sha <SECRET> priv aes <NUM> <SECRET> access <NUM>"

