# ---- local user accounts
- template: "username <WORD:user> privilege <NUM:priv> algorithm-type scrypt secret <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'scrypt'"}]
- template: "username <WORD:user> privilege <NUM:priv> algorithm-type sha256 secret <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'sha256'"}]
- template: "username <WORD:user> privilege <NUM:priv> algorithm-type md5 secret <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'md5'"}]
- template: "username <WORD:user> privilege <NUM:priv> secret <NUM:type> <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits:
    - {key: USER.PRIVILEGE, value: "priv"}
    - {key: USER.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt'})"}
- template: "username <WORD:user> privilege <NUM:priv> secret <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'md5'"}]
- template: "username <WORD:user> privilege <NUM:priv> password <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "priv"}, {key: USER.HASH_ALGORITHM, value: "'type7'"}]
- template: "username <WORD:user> password <SECRET>"
  scope: {type: USER, id: "{user}"}
  emits: [{key: USER.PRIVILEGE, value: "1"}, {key: USER.HASH_ALGORITHM, value: "'plaintext'"}]

# ---- enable password
- {template: "enable algorithm-type scrypt secret <SECRET>", emits: [{key: ENABLE.HASH_ALGORITHM, value: "'scrypt'"}]}
- {template: "enable algorithm-type sha256 secret <SECRET>", emits: [{key: ENABLE.HASH_ALGORITHM, value: "'sha256'"}]}
- {template: "enable algorithm-type md5 secret <SECRET>", emits: [{key: ENABLE.HASH_ALGORITHM, value: "'md5'"}]}
- template: "enable secret <NUM:type> <SECRET>"
  emits: [{key: ENABLE.HASH_ALGORITHM, value: "enum_map(type, {5: 'md5', 8: 'sha256', 9: 'scrypt', 0: 'plaintext'})"}]
- {template: "enable secret <SECRET>", emits: [{key: ENABLE.HASH_ALGORITHM, value: "'md5'"}]}

