  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.URPF, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip address <IPV4:addr> <MASK:mask>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.IP_ADDRESS, value: "str(addr) + '/' + str(mask_to_prefix(mask))"}]
- template: "interface <IFNAME:ifname> > ip address <IPV4:addr> <MASK:mask> secondary"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.IP_ADDRESS, value: "str(addr) + '/' + str(mask_to_prefix(mask))"}]
- template: "interface <IFNAME:ifname> > ip directed-broadcast"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.DIRECTED_BROADCAST, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip redirects"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.IP_REDIRECTS, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip unreachables"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.IP_UNREACHABLES, value: "not negated"}]
- template: "interface <IFNAME:ifname> > ip ospf message-digest-key <NUM:key_id> md5 <SECRET>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.OSPF_AUTH, value: "'md5'"}, {key: INTERFACE.OSPF_AUTH_KEY_ID, value: "key_id"}]
- template: "interface <IFNAME:ifname> > ip authentication key-chain eigrp <NUM> <WORD:kc>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.EIGRP_AUTH_KEY_CHAIN, value: "kc"}]
- template: "interface <IFNAME:ifname> > ip authentication mode eigrp <NUM> md5"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.EIGRP_AUTH, value: "'md5'"}]
- template: "interface <IFNAME:ifname> > spanning-tree bpduguard <ENUM:mode>"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.BPDUGUARD, value: "mode == 'enable'"}]
- template: "interface <IFNAME:ifname> > spanning-tree portfast"
  scope: {type: INTERFACE, id: "{ifname}"}
  emits: [{key: INTERFACE.PORTFAST, value: "not negated"}]
- template: "interface <IFNAME:ifname> > carrier-delay msec <NUM:ms>"
  scope: {type: INTERFACE, id: "{ifname}"}
