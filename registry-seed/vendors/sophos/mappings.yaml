# Reviewer-approved Sophos SFOS mappings.
# Sophos uses XML-like nested config; parent templates declare scope or are ignored.

# ---- ATP
- {template: "ATP", ignore: true}
- {template: "ATP > Policy <WORD>", ignore: true}
- {template: "ATP > ThreatProtectionStatus <ENUM>", ignore: true}

