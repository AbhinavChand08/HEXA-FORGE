# Canonical keys: password policy.
# type: int | float | bool | string | enum | ip | cidr     cardinality: single | list

- key: PASSWORD.MIN_LENGTH
  type: int
  unit: characters
  scope: GLOBAL
  category: password_policy
  description: Minimum length of local account passwords
  aliases: [security passwords min-length, minimum password length, password-policy minimum-length]

- key: PASSWORD.COMPLEXITY_ENABLED
  type: bool
  scope: GLOBAL
  category: password_policy
  description: Password complexity requirements are enforced
  aliases: [password complexity, strong password policy]

- key: PASSWORD.MIN_DIGITS
  type: int
  unit: characters
  scope: GLOBAL
  category: password_policy
  description: Minimum number of digit characters required in a password
  aliases: [minimum digits, password-policy minimum-digits]

- key: PASSWORD.MIN_SPECIAL
  type: int
  unit: characters
  scope: GLOBAL
  category: password_policy
  description: Minimum number of special characters required in a password
  aliases: [minimum special, password-policy minimum-special]

- key: PASSWORD.MIN_UPPER
  type: int
  unit: characters
  scope: GLOBAL
  category: password_policy
  description: Minimum number of uppercase characters required in a password
  aliases: [minimum upper, password-policy minimum-upper]

- key: PASSWORD.MIN_LOWER
  type: int
  unit: characters
  scope: GLOBAL
  category: password_policy
  description: Minimum number of lowercase characters required in a password
  aliases: [minimum lower, password-policy minimum-lower]
